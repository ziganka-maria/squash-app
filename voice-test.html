<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка голоса — сквош</title>
<style>
:root { --bg: #f4f1ea; --card: #fffdf8; --ink: #1d2320; --mute: #6b726d; --line: #ddd6c8; --acc: #1f6f5c; --acc-ink: #fff; --warn: #b23a2b; }
@media (prefers-color-scheme: dark) { :root { --bg: #151a18; --card: #1e2522; --ink: #ecefe9; --mute: #9aa39d; --line: #313b36; --acc: #3fae91; --acc-ink: #07110d; --warn: #ef8a7b; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 560px; margin-inline: auto; }
h1 { font-size: 22px; margin: 4px 0 4px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 0 0 8px; }
.sub { color: var(--mute); margin: 0 0 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.row:last-child { border-bottom: 0; }
.row b { text-align: right; word-break: break-word; }
.bad { color: var(--warn); }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
button.main { width: 100%; background: var(--acc); color: var(--acc-ink); border: 0; font-size: 20px; font-weight: 600; padding: 20px; }
button.main.on { background: var(--warn); color: #fff; }
.opts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; }
.opts label { display: flex; align-items: center; gap: 6px; }
.heard { min-height: 3.2em; margin-top: 12px; font-size: 18px; }
.heard small { display: block; color: var(--mute); font-size: 13px; }
.board { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; }
.board .nm { font-size: 18px; }
.board .sc { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.1; }
.board .srv { color: var(--acc); }
.state { margin-top: 8px; color: var(--mute); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { padding: 7px 11px; font-size: 14px; border-radius: 999px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.ctl input, .ctl select { font: inherit; padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); max-width: 9em; }
#log { font: 12px/1.5 ui-monospace, Consolas, monospace; max-height: 240px; overflow: auto; white-space: pre-wrap; color: var(--mute); }
textarea { width: 100%; height: 160px; font: 12px ui-monospace, Consolas, monospace; margin-top: 8px; }
</style>
</head>
<body>
<h1>Проверка голоса</h1>
<p class="sub">Нажми кнопку, скажи фразу вслух и посмотри, что приложение услышало и поняло. Потом нажми «Скопировать отчёт» внизу и пришли мне.</p>

<div class="card">
  <h2>Что умеет это устройство</h2>
  <div id="feat"></div>
</div>

<div class="card">
  <button id="mic" class="main">🎤 Нажми и скажи</button>
  <div class="opts">
    <label><input type="checkbox" id="cont"> слушать постоянно</label>
    <label><input type="checkbox" id="tts" checked> озвучка</label>
  </div>
  <div class="heard" id="heard"><small>Тут появится услышанное</small></div>
</div>

<div class="card">
  <h2>Табло</h2>
  <div class="board" id="board"></div>
  <div class="state" id="state"></div>
  <div class="ctl">
    <input id="n0" value="Я" aria-label="Имя первого"><input id="n1" value="Соперник" aria-label="Имя второго">
    <select id="fmt" aria-label="Формат"><option value="1">1 гейм</option><option value="2" selected>до 2 побед</option><option value="3">до 3 побед</option></select>
    <select id="first" aria-label="Кто подаёт"><option value="0">Подаю я</option><option value="1">Подаёт соперник</option></select>
    <button id="reset">Новый матч</button>
  </div>
</div>

<div class="card">
  <h2>Фразы для проверки (нажми — как будто сказала)</h2>
  <div class="chips" id="chips"></div>
</div>

<div class="card">
  <h2>Журнал</h2>
  <div id="log"></div>
  <div class="ctl"><button id="copy">Скопировать отчёт</button></div>
  <textarea id="report" hidden readonly></textarea>
</div>

<script src="squash-core.js"></script>
<script src="squash-voice.js"></script>
<script>
'use strict';
(function () {
const Q = window.Squash, V = Q.Voice;
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const hasTTS = 'speechSynthesis' in window;
const stats = { heard: 0, restarts: 0, started: 0, longest: 0, errors: {}, pressed: 0 };
const lines = [];
let st = Q.newMatch({ gamesToWin: 2 });
let rec = null, active = false, want = false, speaking = false, t0 = 0;

const log = msg => {
  lines.push(new Date().toLocaleTimeString('ru-RU') + '  ' + msg);
  if (lines.length > 300) lines.shift();
  const el = $('log'); el.textContent = lines.slice(-40).reverse().join('\n');
};

// ——— возможности устройства ———
const ruVoices = () => hasTTS ? speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang)) : [];
const features = () => [
  ['Распознавание речи', SR ? 'есть' : 'НЕТ', !SR],
  ['Озвучка ответов', hasTTS ? 'есть' : 'НЕТ', !hasTTS],
  ['Русских голосов', ruVoices().length ? ruVoices().length + ' (' + ruVoices()[0].name + ')' : 'не найдено', hasTTS && !ruVoices().length],
  ['Защищённое соединение', window.isSecureContext ? 'да' : 'нет — микрофон не заработает', !window.isSecureContext],
  ['Запущено как приложение', (matchMedia('(display-mode: standalone)').matches || navigator.standalone) ? 'да' : 'нет, в браузере', false],
  ['Браузер', navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''), false]
];
const renderFeat = () => {
  $('feat').innerHTML = '';
  features().forEach(([k, v, bad]) => {
    const r = document.createElement('div'); r.className = 'row';
    const a = document.createElement('span'); a.textContent = k;
    const b = document.createElement('b'); b.textContent = v; if (bad) b.className = 'bad';
    r.append(a, b); $('feat').append(r);
  });
};

// ——— табло ———
const renderBoard = () => {
  const b = $('board'); b.innerHTML = '';
  [0, 1].forEach(p => {
    const n = document.createElement('div'); n.className = 'nm' + (st.server === p && st.status === 'playing' ? ' srv' : '');
    n.textContent = (st.server === p && st.status === 'playing' ? '● ' : '') + st.names[p] + (st.server === p && st.status === 'playing' ? (st.boxFree ? ' — подача (сторону выбирает)' : ' — подача ' + Q.side(st.box)) : '');
    const s = document.createElement('div'); s.className = 'sc'; s.textContent = st.score[p];
    b.append(n, s);
  });
  const g = Q.games(st), bl = Q.balls(st);
  let info = 'Геймы ' + g[0] + ' : ' + g[1] + ' (до ' + st.gamesToWin + ' побед)';
  if (st.status === 'between') info += ' · гейм окончен — скажи «ноль ноль» или «следующий гейм»';
  if (st.status === 'finished') info += ' · матч окончен: ' + st.names[st.winner];
  if (bl.match !== null) info += ' · матч-бол: ' + st.names[bl.match]; else if (bl.game !== null) info += ' · гейм-бол: ' + st.names[bl.game];
  $('state').textContent = info;
};

const describe = (c, s) => {
  const n = s.names;
  switch (c.cmd) {
    case 'point': return 'очко — ' + n[c.who] + (c.claim ? ', назван счёт ' + c.claim.join(':') : '') + (c.handOut ? ', «переход»' : '');
    case 'stroke': return 'stroke — ' + (c.who === null ? 'кому — не названо' : n[c.who]);
    case 'noLet': return 'no let — просьба отклонена, играем дальше';
    case 'let': return 'let — переигровка';
    case 'score': return c.byPlayer ? 'счёт по игрокам ' + c.byPlayer.join(':') : 'счёт ' + c.claim.join(':');
    case 'undo': return 'отмена';
    case 'query': return 'спросили счёт';
    case 'next': return 'следующий гейм';
    case 'handOut': return 'переход подачи';
    case 'box': return 'сторона подачи — ' + Q.side(c.box);
    default: return 'НЕ ПОНЯТО';
  }
};

// ——— озвучка ———
const speak = text => {
  if (!$('tts').checked || !hasTTS || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  const v = ruVoices()[0]; if (v) u.voice = v;
  // пока говорит приложение, микрофон не слушает — иначе оно услышит само себя
  speaking = true;
  if (active) try { rec.abort(); } catch (e) {}
  const done = () => { speaking = false; if (want) setTimeout(startRec, 200); };
  u.onend = done; u.onerror = done;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};

// ——— услышанное ———
const heard = (text, conf, typed) => {
  if (!typed) stats.heard++;
  const r = V.apply(st, text);
  st = r.state;
  const what = describe(r.cmd, st);
  $('heard').innerHTML = '';
  const a = document.createElement('div'); a.textContent = '«' + text + '»';
  const b = document.createElement('small'); b.textContent = 'Понято: ' + what + (r.say ? ' · Ответ: ' + r.say : '');
  $('heard').append(a, b);
  log((typed ? 'нажато' : 'услышано') + ': «' + text + '»' + (conf ? ' (уверенность ' + (+conf).toFixed(2) + ')' : '') + ' → ' + what + ' → «' + r.say + '»');
  renderBoard();
  speak(r.say);
};

// ——— микрофон ———
const setBtn = () => { const on = active || want; $('mic').textContent = on ? '⏹ Остановить' : '🎤 Нажми и скажи'; $('mic').classList.toggle('on', on); };
const startRec = () => {
  if (!SR || speaking) return;
  rec = new SR();
  rec.lang = 'ru-RU'; rec.interimResults = true; rec.continuous = $('cont').checked; rec.maxAlternatives = 1;
  rec.onstart = () => { active = true; t0 = Date.now(); stats.started++; setBtn(); log('микрофон включён'); };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) heard(r[0].transcript.trim(), r[0].confidence, false); else interim += r[0].transcript;
    }
    if (interim) { $('heard').innerHTML = ''; const s = document.createElement('small'); s.textContent = 'Слышу: ' + interim; $('heard').append(s); }
  };
  rec.onerror = e => {
    stats.errors[e.error] = (stats.errors[e.error] || 0) + 1; log('ошибка микрофона: ' + e.error);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { want = false; setBtn(); }
  };
  rec.onend = () => {
    active = false;
    const sec = (Date.now() - t0) / 1000; stats.longest = Math.max(stats.longest, sec);
    log('микрофон выключился через ' + sec.toFixed(1) + ' с');
    if (want && !speaking) { stats.restarts++; setTimeout(() => { if (want && !speaking && !active) startRec(); }, 250); }
    setBtn();
  };
  try { rec.start(); } catch (e) { log('микрофон не запустился: ' + e.message); }
};
$('mic').onclick = () => {
  if (!SR) { log('в этом браузере нет распознавания речи'); return; }
  stats.pressed++;
  if (active || want) { want = false; try { rec.abort(); } catch (e) {} setBtn(); return; }
  want = $('cont').checked;
  startRec(); setBtn();
};

// ——— кнопки ———
const newMatch = () => {
  st = Q.newMatch({ names: [$('n0').value.trim() || 'Я', $('n1').value.trim() || 'Соперник'], gamesToWin: +$('fmt').value, firstServer: +$('first').value });
  log('новый матч: ' + st.names.join(' — ') + ', до ' + st.gamesToWin + ' побед'); renderBoard();
};
$('reset').onclick = newMatch;
['fmt', 'first'].forEach(id => $(id).onchange = newMatch);

const PHRASES = ['ноль ноль', 'первый выиграл один ноль', 'второй выиграл переход один один', 'очко мне', 'очко ему', 'yes let', 'переигровка', 'stroke мне', 'stroke ему', 'no let',
  'семь пять', 'мне три ему девять', 'отмена', 'какой счёт', 'справа', 'следующий гейм'];
PHRASES.forEach(p => { const b = document.createElement('button'); b.textContent = p; b.onclick = () => heard(p, null, true); $('chips').append(b); });

$('copy').onclick = () => {
  const rep = ['Проверка голоса — сквош', new Date().toString(),
    ...features().map(f => f[0] + ': ' + f[1]),
    'Нажатий на микрофон: ' + stats.pressed + '; распознано фраз: ' + stats.heard + '; включений микрофона: ' + stats.started + '; автоперезапусков: ' + stats.restarts +
      '; самая долгая сессия: ' + stats.longest.toFixed(1) + ' с; режим «постоянно»: ' + ($('cont').checked ? 'да' : 'нет'),
    'Ошибки: ' + (Object.keys(stats.errors).length ? JSON.stringify(stats.errors) : 'нет'),
    '--- журнал ---', ...lines].join('\n');
  const ta = $('report'); ta.value = rep; ta.hidden = false; ta.select();
  const done = () => { $('copy').textContent = 'Скопировано ✓'; setTimeout(() => $('copy').textContent = 'Скопировать отчёт', 2500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(rep).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) {} });
  else try { document.execCommand('copy'); done(); } catch (e) {}
};

if (hasTTS) speechSynthesis.onvoiceschanged = renderFeat;
renderFeat(); renderBoard(); setBtn();
log('страница открыта');
document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
